# 云端 8×H100 正式训练预设（CUDA 12.8）——推理服务架构
# 拓扑：8 个 EvalServer（每 GPU 一个）+ num_workers 个纯 CPU 自博弈进程（0=自动按核数）
# 建议先跑 1-2 个迭代，观察日志中的 moves/s、evals/s、avg_batch 与 htop CPU 占用再调参
model: {blocks: 10, filters: 128, history_steps: 2}
mcts:
  # 前 30~50 迭代可先用 num_sims=400 加快出数据（早期网络弱、更多模拟收益低），
  # 数据规模起来后再升到 600+ 提升棋力。
  # 阶段一保持 600（升 1000 成本 +37% 而收益未验证）；计划在迁移大模型前的
  # 最后 ~20 迭代临时升到 1000，为大模型蒸馏热启动灌一份高质量 π 的 buffer。
  num_sims: 600
  c_puct: 1.8
  dirichlet_alpha: 0.2
  temp_moves: 32
  temp_final: 0.15    # temp_moves 后保留小温度采样，打破确定性循环（抑制 80%+ 重复判和）
  batch_size: 96
selfplay:
  games_per_iteration: 2000
  # 瓶颈在 CPU 端 Python MCTS：worker 是纯 CPU 进程，数量按 vCPU 数自动扩展
  # （max(8, cpu_count - num_gpus - 4)）；如需手动指定填正整数。
  num_workers: 0
  games_per_worker: 16
  eval_max_batch: 4096      # H100 单次前向上限（3.2M 模型毫无压力）
  eval_wait_ms: 2.0         # 请求聚合窗口：调大→batch 更大但叶子延迟更高
  eval_fp16: true           # bf16 推理
  max_game_plies: 400
  value_blend_init: 0.5
  value_blend_iters: 30
  draw_penalty: -0.2  # 同时注入 MCTS 树内和棋值（搜索会主动避免重复循环）
  resign_start_iter: 10
train:
  device: cuda
  num_gpus: 8
  batch_size: 4096
  # 0 = 按新样本量自动定步数（sample_reuse×新样本/batch，夹在 [10,5000]）：
  # buffer 小的早期只训一两百步，防止把首批噪声数据背 30 遍（曾实测 410 万采样 vs 13.9 万样本）
  train_steps_per_iteration: 0
  sample_reuse: 3.0
  buffer_window: 1500000
  min_buffer_to_train: 100000
  # ── 阶段一续训（iter 300-599，2026-07 天梯诊断后设定）────────────────
  # 300 迭代已跑完首条余弦（lr 落地板 1e-4）而天梯仍 +58 Elo/50 迭代 → 暖重启：
  # 峰值减半 + 地平线翻倍，resume 点（iter 300, progress=0.5）有效 LR 精确 = 3.0e-4，
  # 再沿余弦退回 1e-4。若从头重训请恢复 lr: 0.001。
  lr: 0.0005
  total_iterations: 600
  amp: true
arena: {arena_games: 40, arena_sims: 200, gate_threshold: 0.55}
log: {log_interval_sec: 30.0, train_log_interval: 100, tensorboard: true}
